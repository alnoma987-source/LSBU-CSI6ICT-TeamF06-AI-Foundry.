- btnSubmit:
    Control: Classic/Button@2.2.0
    Properties:
      Text: ="Submit request"
      Size: =11
      Visible: =(IsBlank(locView) || locView = "form")
      X: =680
      Y: =610
      Width: =180
      Height: =40
      OnSelect: |-
        =If(
            Len(lblErrorText.Text) > 0,
            UpdateContext({locShowErrors: true}),
            Set(varNewID, "AIF-2026-" & Text(Coalesce(Max(colRequests, Value(Right(RequestID, 3))), 0) + 1, "000"));
            Collect(
                colRequests,
                {
                    RequestID: varNewID,
                    Title: Trim(txtTitle.Text),
                    Department: ddDepartment.Selected.Value,
                    BusinessOwner: Trim(txtBusinessOwner.Text),
                    Route: ddRoute.Selected.Value,
                    CurrentTools: Trim(txtCurrentTools.Text),
                    ProcessDescription: Trim(txtProcessDesc.Text),
                    PainPoints: Trim(txtPainPoints.Text),
                    EstWeeklyHoursSaved: Value(txtHoursSaved.Text),
                    ExpectedBenefit: Switch(ddBenefit.Selected.Value, "Save staff time (Efficiency)", "Efficiency", "Save money or reduce costs (Financial)", "Financial", "Better service for students or staff (Service)", "Service", "Fewer errors or less risk (Risk Reduction)", "Risk Reduction", "Better data or reporting (Data)", "Data", "Supports university strategy (Strategic)", "Strategic", ddBenefit.Selected.Value),
                    PersonalDataGDPR: tglGDPR.Value,
                    FinancialData: tglFinancial.Value,
                    DPIACheckStatus: If(tglGDPR.Value || tglFinancial.Value, "Hold", "Not required"),
                    LifecycleStatus: "New Requests",
                    RequesterEmail: User().Email,
                    SubmittedOn: Now(),
                    Scored: false, SA: 0, BP: 0, SV: 0, CX: 0, RR: 0, Priority: 0, Tier: "",
                    DecisionReason: "",
                    IsSample: false
                }
            );
            Collect(colHistory, {RequestID: varNewID, At: Now(), By: User().FullName, What: "Submitted"});
            Set(varLast, LookUp(colRequests, RequestID = varNewID));
            UpdateContext({locShowErrors: false, locView: "done"});
            Reset(txtTitle); Reset(ddDepartment); Reset(txtBusinessOwner); Reset(ddRoute); Reset(txtProcessDesc); Reset(txtCurrentTools); Reset(txtPainPoints); Reset(txtHoursSaved); Reset(ddBenefit); Reset(tglGDPR); Reset(tglFinancial)
        )
