      Text: ="Your request is now at New Requests. The Digital Project Manager will review and score it, then move it into the pipeline. You can follow its status in My requests." & If(varLast.DPIACheckStatus = "Hold", " Because you flagged " & If(varLast.PersonalDataGDPR && varLast.FinancialData, "personal and financial", If(varLast.PersonalDataGDPR, "personal", "financial")) & " data, it will be held for a DPIA check before approval.", "")
      Size: =11
      Color: =RGBA(50, 49, 48, 1)
      Visible: =locView = "done"
