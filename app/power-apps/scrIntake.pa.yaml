- galMine:
    Control: Gallery@2.15.0
    Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
    Properties:
      Items: =Sort(Filter(colRequests, RequesterEmail = User().Email && !IsSample), SubmittedOn, SortOrder.Descending)
      TemplateSize: =90
      TemplatePadding: =0
      BorderColor: =RGBA(237, 235, 233, 1)
      BorderThickness: =1
      Visible: =locView = "mine"
      X: =40
      Y: =112
      Width: =900
      Height: =560
    Children:
      - lblMineMeta:
          Control: Label@2.5.1
          Properties:
            Text: =ThisItem.RequestID & "  ·  submitted " & Text(ThisItem.SubmittedOn, "d mmm yyyy")
            Size: =9
            Color: =RGBA(96, 94, 92, 1)
            X: =12
            Y: =6
            Width: =860
            Height: =18
      - lblMineTitle:
          Control: Label@2.5.1
          Properties:
            Text: =ThisItem.Title
            Size: =11
            Color: =RGBA(50, 49, 48, 1)
            FontWeight: =FontWeight.Semibold
            X: =12
            Y: =24
            Width: =860
            Height: =22
      - lblMineStatus:
          Control: Label@2.5.1
          Properties:
            Text: |-
              ="Status: " & ThisItem.LifecycleStatus & If(ThisItem.DPIACheckStatus = "Hold", "  ·  waiting for a data protection check", "")
            Size: =10
            Color: =RGBA(50, 49, 48, 1)
            X: =12
            Y: =46
            Width: =860
            Height: =18
      - lblMineReason:
          Control: Label@2.5.1
          Properties:
            Text: |-
              ="Reason: " & ThisItem.DecisionReason
            Size: =10
            Color: =RGBA(122, 65, 0, 1)
            Visible: =!IsBlank(ThisItem.DecisionReason)
            X: =12
            Y: =64
            Width: =860
            Height: =18
