- lblErrorText:
    Control: Label@2.5.1
    Properties:
      Text: =If(IsBlank(Trim(txtTitle.Text)), "• Enter a request title" & Char(10), "") & If(IsBlank(ddDepartment.Selected.Value), "• Select your department or directorate" & Char(10), "") & If(IsBlank(Trim(txtBusinessOwner.Text)), "• Enter the name of the business owner" & Char(10), "") & If(IsBlank(Trim(txtProcessDesc.Text)), "• Describe the current process" & Char(10), "") & If(!IsBlank(Trim(txtProcessDesc.Text)) && Len(Trim(txtProcessDesc.Text)) < 20, "• Describe the current process in a little more detail (at least 20 characters)" & Char(10), "") & If(IsBlank(Trim(txtCurrentTools.Text)), "• Enter the tools used today, for example Excel or Outlook" & Char(10), "") & If(IsBlank(Trim(txtPainPoints.Text)), "• Describe what goes wrong or takes too long today" & Char(10), "") & If(IsBlank(txtHoursSaved.Text) || Value(txtHoursSaved.Text) <= 0, "• Enter staff hours saved per week, more than 0" & Char(10), "") & If(!IsBlank(txtHoursSaved.Text) && Value(txtHoursSaved.Text) > 168, "• Enter staff hours saved per week, 168 or fewer" & Char(10), "") & If(IsBlank(ddBenefit.Selected.Value), "• Select the main benefit you expect" & Char(10), "")
