            {p: Round((30 * (Value(ddSA.Selected.Value) - 1) + 25 * (Value(ddBP.Selected.Value) - 1) + 15 * (Value(ddSV.Selected.Value) - 1) + 15 * (5 - Value(ddCX.Selected.Value)) + 15 * (5 - Value(ddRR.Selected.Value))) / 4, 0)},
            With(
                {tier: If(p >= 75, "High", p >= 50, "Medium", "Low")},
                Patch(
                    colRequests,
                    LookUp(colRequests, RequestID = varSelID),
                    {Scored: true, SA: Value(ddSA.Selected.Value), BP: Value(ddBP.Selected.Value), SV: Value(ddSV.Selected.Value), CX: Value(ddCX.Selected.Value), RR: Value(ddRR.Selected.Value), Priority: p, Tier: tier}
                );
                Collect(colHistory, {RequestID: varSelID, At: Now(), By: User().FullName, What: "Triage scores saved: " & p & "/100 (" & tier & ")"})
            )
        )
- lblScoreHow:
    Control: Label@2.5.1
    Properties:
      Text: |-
        ="How the score works: Strategic alignment 30%, Benefit potential 25%, Speed to value 15%, Complexity 15% and Resource requirement 15% (the last two inverted), giving 0 to 100. High is 75 or more, Medium 50 to 74, Low below 50. The score supports the decision; a person still makes it."
      Size: =8
      Color: =RGBA(96, 94, 92, 1)
      Visible: =varDrawer
      VerticalAlign: =VerticalAlign.Top
      X: =862
      Y: =420
      Width: =488
      Height: =42
- lblDPIAState:
    Control: Label@2.5.1
    Properties:
      Text: |-
        ="DPIA check: " & Switch(LookUp(colRequests, RequestID = varSelID).DPIACheckStatus, "Hold", "on hold", "Approved", "approved", "not required")
      Size: =10
      Color: =If(LookUp(colRequests, RequestID = varSelID).DPIACheckStatus = "Hold", RGBA(122, 65, 0, 1), RGBA(16, 124, 16, 1))
      FontWeight: =FontWeight.Semibold
      Visible: =varDrawer
      X: =862
      Y: =464
      Width: =320
      Height: =28
- btnApproveDPIA:
    Control: Classic/Button@2.2.0
    Properties:
      Text: ="Record DPIA approval"
      Size: =10
      Visible: =varDrawer && LookUp(colRequests, RequestID = varSelID).DPIACheckStatus = "Hold"
      X: =1170
      Y: =464
      Width: =180
      Height: =28
      OnSelect: |-
        =Patch(colRequests, LookUp(colRequests, RequestID = varSelID), {DPIACheckStatus: "Approved"});
        Collect(colHistory, {RequestID: varSelID, At: Now(), By: User().FullName, What: "DPIA approval recorded"})
- lblDecisionHead:
    Control: Label@2.5.1
    Properties:
      Text: ="Defer, reject or ask for more information"
      Size: =11
      Color: =RGBA(50, 49, 48, 1)
      FontWeight: =FontWeight.Semibold
      Visible: =varDrawer
      X: =862
      Y: =498
      Width: =488
      Height: =20
- ddDecision:
    Control: Classic/DropDown@2.3.1
    Properties:
      Items: =["Defer", "Reject", "Needs more information"]
      AllowEmptySelection: =true
      Default: =Blank()
      AccessibleLabel: ="Decision"
      Size: =11
      Visible: =varDrawer
      X: =862
      Y: =520
      Width: =240
      Height: =30
- btnConfirmDecision:
    Control: Classic/Button@2.2.0
    Properties:
      Text: ="Confirm decision"
      Size: =10
      Visible: =varDrawer
      X: =1170
      Y: =520
      Width: =180
      Height: =30
      OnSelect: |-
        =If(
            IsBlank(ddDecision.Selected.Value) || Len(Trim(txtReason.Text)) < 10,
            Set(varDecErr, true),
            With(
                {st: Switch(ddDecision.Selected.Value, "Defer", "Deferred", "Reject", "Rejected", "Needs information")},
                Patch(colRequests, LookUp(colRequests, RequestID = varSelID), {LifecycleStatus: st, DecisionReason: Trim(txtReason.Text)});
                Collect(colHistory, {RequestID: varSelID, At: Now(), By: User().FullName, What: st & ". Reason: " & Trim(txtReason.Text)})
            );
            Set(varDecErr, false);
            Reset(txtReason);
            Reset(ddDecision)
        )
- txtReason:
    Control: Classic/TextInput@2.3.2
    Properties:
      Default: =""
      Mode: =TextMode.MultiLine
      HintText: ="Reason for the decision. The requester will see this. Keep it plain and specific."
      AccessibleLabel: ="Reason for the decision"
      Size: =10
      BorderColor: =If(varDecErr && Len(Trim(txtReason.Text)) < 10, RGBA(168, 0, 0, 1), RGBA(96, 94, 92, 1))
      Visible: =varDrawer
      X: =862
      Y: =554
      Width: =488
      Height: =44
- lblDecisionErr:
    Control: Label@2.5.1
    Properties:
      Text: ="Choose a decision and enter the reason (at least 10 characters)."
      Size: =9
      Color: =RGBA(168, 0, 0, 1)
      FontWeight: =FontWeight.Semibold
      Visible: =varDrawer && varDecErr
      Live: =Live.Assertive
      X: =862
      Y: =600
      Width: =488
      Height: =18
- lblHistHead:
    Control: Label@2.5.1
    Properties:
      Text: |-
        ="History: every change records who made it and when"
      Size: =10
      Color: =RGBA(50, 49, 48, 1)
      FontWeight: =FontWeight.Semibold
      Visible: =varDrawer
      X: =862
      Y: =620
      Width: =488
      Height: =20
- galHistory:
    Control: Gallery@2.15.0
    Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
    Properties:
      Items: =Sort(Filter(colHistory, RequestID = varSelID), At, SortOrder.Descending)
      TemplateSize: =22
      TemplatePadding: =0
      Visible: =varDrawer
      X: =862
      Y: =642
      Width: =488
      Height: =118
    Children:
      - lblHistRow:
          Control: Label@2.5.1
          Properties:
            Text: =Text(ThisItem.At, "d mmm yyyy hh:mm") & "  ·  " & ThisItem.What & "  ·  " & ThisItem.By
            Size: =8
            Color: =RGBA(50, 49, 48, 1)
            X: =4
            Y: =0
            Width: =Parent.TemplateWidth - 8
            Height: =22
